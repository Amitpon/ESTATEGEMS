# הגדרות Netlify.
#
# חשוב: הדאטה של בנק ישראל ושל הלמ"ס נמשכים בזמן הבילד ולא מהדפדפן,
# ונארזים כ-snapshot סטטי ל-bundle. בנק ישראל כי אין לו CORS בכלל.
# למ"ס כן תומך CORS, אבל המדדים מתעדכנים חודשית - אין טעם להכות את
# ה-API מהדפדפן בכל טעינה כשהערך משתנה פעם בחודש. govmap שונה: הוא
# נקרא ישירות מהדפדפן, כי הנתון (עסקאות שכונתיות) תלוי בכתובת שהמשתמש
# מקליד ולא ניתן ל-snapshot מראש.

[build]
  # ה-|| מכוון. אם משיכת נתון כלשהו נופלת, הדיפלוי לא נכשל - הוא ממשיך עם
  # ה-snapshot המחויב שכבר קיים בריפו. הנתון מוצג למשתמש עם התאריך שלו
  # ממילא, אז נתון ישן הוא הרבה פחות גרוע מאתר שלא עולה.
  # שים לב ל-";" לפני build: כך כשל בבילד עצמו עדיין מפיל את הדיפלוי כראוי.
  command = "npm run data:boi || echo 'אזהרה: משיכת נתוני בנק ישראל נכשלה. ממשיך עם ה-snapshot הקיים.' ; npm run data:cbs || echo 'אזהרה: משיכת נתוני הלמ\"ס נכשלה. ממשיך עם ה-snapshot הקיים.' ; npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# שמשון. חייב להופיע לפני כלל ה-SPA, אחרת /* בולע אותו ומחזיר HTML
# במקום את תשובת הפונקציה. סדר הכללים כאן קובע.
[[redirects]]
  from = "/api/shimshon"
  to = "/.netlify/functions/shimshon"
  status = 200
  force = true

# SPA - כל נתיב מוגש מ-index.html כדי שניווט בצד לקוח יעבוד ברענון.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
